<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nestlé Professional - Dashboard de Reuniones MORE</title>
    <style>
        :root {
            --nestle-blue: #005CA9;
            --nestle-red: #E31837;
            --nestle-gold: #D4AF37;
            --text-primary: #1d1d1f;
            --text-secondary: #515154;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 12px 32px 0 rgba(0, 92, 169, 0.08);
            --card-bg: rgba(255, 255, 255, 0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; }

        body {
            background: #f8fafc;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(0, 92, 169, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(227, 24, 55, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(240, 246, 255, 0.7) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow-1 {
            position: fixed; top: -100px; left: -100px; width: 450px; height: 450px;
            background: linear-gradient(135deg, rgba(0, 92, 169, 0.12), rgba(128, 212, 255, 0.15));
            filter: blur(120px); border-radius: 50%; z-index: -1;
        }

        .ambient-glow-2 {
            position: fixed; bottom: -100px; right: -100px; width: 500px; height: 500px;
            background: linear-gradient(135deg, rgba(227, 24, 55, 0.1), rgba(255, 153, 168, 0.12));
            filter: blur(140px); border-radius: 50%; z-index: -1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 20px; border-bottom: 2px solid rgba(0, 92, 169, 0.1);
            padding-bottom: 20px; margin-bottom: 25px;
        }

        .brand-container { display: flex; align-items: center; gap: 18px; }

        .brand-logo {
            background: rgba(255, 255, 255, 0.9); padding: 10px 18px; border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 92, 169, 0.1); display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .title-area h1 {
            font-size: 26px; font-weight: 800; letter-spacing: 0.5px;
            color: var(--nestle-blue);
        }

        .title-area p { font-size: 13px; color: var(--text-secondary); font-weight: 500; }

        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }

        .filter-group label {
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--nestle-blue);
        }

        .filter-group select {
            background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 92, 169, 0.2);
            border-radius: 12px; padding: 10px 14px; color: var(--text-primary); outline: none; font-size: 14px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: border-color 0.2s;
        }

        .filter-group select:focus { border-color: var(--nestle-blue); }
        .filter-group select option { background: #ffffff; color: var(--text-primary); }

        .summary-header {
            font-size: 18px; font-weight: 700; margin-bottom: 15px; color: var(--nestle-blue);
            display: flex; align-items: center; gap: 10px;
        }

        .summary-header::before { content: ''; width: 4px; height: 18px; background: var(--nestle-red); border-radius: 2px; }

        .motivo-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }

        .motivo-card {
            background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px; padding: 18px; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .motivo-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 92, 169, 0.08);
        }

        .motivo-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--nestle-blue), var(--nestle-red));
        }

        .motivo-title { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
        .motivo-count { font-size: 28px; font-weight: 800; color: var(--nestle-blue); }
        .motivo-percentage { font-size: 12px; color: #059669; font-weight: 600; margin-top: 4px; }

        .table-container { overflow-x: auto; border-radius: 14px; border: 1px solid rgba(0, 92, 169, 0.15); background: rgba(255, 255, 255, 0.6); }

        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; min-width: 1200px; }

        th {
            background: rgba(0, 92, 169, 0.08); color: var(--nestle-blue); padding: 14px 12px; font-weight: 700;
            text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; border-bottom: 2px solid rgba(0, 92, 169, 0.15);
        }

        td { padding: 12px; border-bottom: 1px solid rgba(0, 92, 169, 0.06); color: var(--text-primary); }

        .badge {
            padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
            background: rgba(0, 92, 169, 0.1); color: var(--nestle-blue); border: 1px solid rgba(0, 92, 169, 0.2);
        }

        .badge-motivo {
            background: rgba(227, 24, 55, 0.1); color: var(--nestle-red); border: 1px solid rgba(227, 24, 55, 0.25);
        }

        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }
    </style>
</head>

        let rawData = [];
        let filteredData = [];

        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        function getWeekOfMonth(dateObj) {
            const day = dateObj.getDate();
            if (day <= 7) return "Semana 1";
            if (day <= 14) return "Semana 2";
            if (day <= 21) return "Semana 3";
            return "Semana 4";
        }

        function parseLocalDate(fechaStr) {
            if (!fechaStr || fechaStr === "NaT" || fechaStr === "None") return null;
            // Si la fecha viene YYYY-MM-DD
            const parts = String(fechaStr).split(' ')[0].split('-');
            if (parts.length === 3) {
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                return new Date(year, month, day);
            }
            return new Date(fechaStr);
        }

        function initDashboard() {
            rawData = initialData.map(row => {
                let rawFecha = row["Fecha"] || row["FECHA"] || "";
                let dateObj = parseLocalDate(rawFecha);
                let fechaStr = "", mesStr = "", semanaStr = "";

                if (dateObj && !isNaN(dateObj.getTime())) {
                    const year = dateObj.getFullYear();
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    fechaStr = `${year}-${month}-${day}`;
                    mesStr = monthNames[dateObj.getMonth()];
                    semanaStr = getWeekOfMonth(dateObj);
                } else {
                    fechaStr = String(rawFecha);
                    mesStr = row["MES"] || "Sin Mes";
                    semanaStr = "Semana 1";
                }

                return {
                    Fecha: fechaStr,
                    Mes: mesStr,
                    Semana: semanaStr,
                    HoraInicio: row["Hora de inicio"] || row["HORA DE INICIO"] || "-",
                    HoraFin: row["Hora de fin"] || row["HORA DE FIN"] || "-",
                    POC: row["POC"] || row["Poc"] || "-",
                    Motivo: row["MOTIVO"] || row["Motivo"] || "-",
                    QuienAtendio: row["QUIEN NOS ATENDIO"] || row["Quien nos atendio"] || "-",
                    ResumenSucedido: row["RESUMEN CORTO DE LO SUCEDIDO"] || row["Resumen corto de lo sucedido"] || "-",
                    SoporteFotografico: row["SOPORTE FOTOGRAFICO"] || row["Soporte fotografico"] || "-",
                    ActualizacionDatos: row["ACTUALIZACION DE DATOS"] || row["Actualizacion de datos"] || "-",
                    SiguientePaso: row["SIGUIENTE PASO (RESUMEN CORTO)"] || row["SIGUIENTE PASO"] || "-"
                };
            });

            populateFilterDropdowns();
            applyFilters();
        }

        function populateFilterDropdowns() {
            const meses = [...new Set(rawData.map(r => r.Mes).filter(Boolean))];
            const pocs = [...new Set(rawData.map(r => r.POC).filter(Boolean))];
            const motivos = [...new Set(rawData.map(r => r.Motivo).filter(Boolean))];
            // Extraer solo las fechas que realmente tienen datos y ordenarlas de más reciente a más antigua
            const fechas = [...new Set(rawData.map(r => r.Fecha).filter(f => f && f !== "-"))].sort().reverse();

            document.getElementById('filter-mes').innerHTML = '<option value="">Todos los Meses</option>' + meses.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('filter-poc').innerHTML = '<option value="">Todos los POC</option>' + pocs.map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('filter-motivo').innerHTML = '<option value="">Todos los Motivos</option>' + motivos.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('filter-fecha-exacta').innerHTML = '<option value="">Todas las Fechas</option>' + fechas.map(f => `<option value="${f}">${f}</option>`).join('');
        }

        ['filter-mes', 'filter-semana', 'filter-poc', 'filter-motivo', 'filter-fecha-exacta'].forEach(id => {
            document.getElementById(id).addEventListener('change', applyFilters);
        });

        function applyFilters() {
            const mesVal = document.getElementById('filter-mes').value;
            const semanaVal = document.getElementById('filter-semana').value;
            const pocVal = document.getElementById('filter-poc').value;
            const motivoVal = document.getElementById('filter-motivo').value;
            const fechaExactaVal = document.getElementById('filter-fecha-exacta').value;

            filteredData = rawData.filter(r => {
                if (mesVal && r.Mes !== mesVal) return false;
                if (semanaVal && r.Semana !== semanaVal) return false;
                if (pocVal && r.POC !== pocVal) return false;
                if (motivoVal && r.Motivo !== motivoVal) return false;
                if (fechaExactaVal && r.Fecha !== fechaExactaVal) return false;
                return true;
            });

            renderSummaryCards();
            renderTable();
        }

        function renderSummaryCards() {
            const container = document.getElementById('motivo-cards-container');
            if (filteredData.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay registros que coincidan.</div>';
                return;
            }
            const total = filteredData.length;
            const motivoCounts = {};
            filteredData.forEach(r => { motivoCounts[r.Motivo] = (motivoCounts[r.Motivo] || 0) + 1; });

            container.innerHTML = Object.entries(motivoCounts).map(([motivo, count]) => `
                <div class="motivo-card">
                    <div class="motivo-title">${motivo}</div>
                    <div class="motivo-count">${count}</div>
                    <div class="motivo-percentage">${((count / total) * 100).toFixed(1)}% del total</div>
                </div>
            `).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No hay registros para mostrar.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredData.map(r => `
                <tr>
                    <td><span class="badge">${r.Fecha}</span></td>
                    <td>${r.HoraInicio}</td>
                    <td>${r.HoraFin}</td>
                    <td><strong>${r.POC}</strong></td>
                    <td><span class="badge badge-motivo">${r.Motivo}</span></td>
                    <td>${r.QuienAtendio}</td>
                    <td>${r.ResumenSucedido}</td>
                    <td>${r.SoporteFotografico}</td>
                    <td>${r.ActualizacionDatos}</td>
                    <td>${r.SiguientePaso}</td>
                </tr>
            `).join('');
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
